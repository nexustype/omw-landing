<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="googlebot" content="noindex,nofollow,noarchive" />
  <title>Daniel Blokbergen CV 2026</title>
  <meta name="description" content="Private CV page for Daniel Blokbergen." />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
  <style>
    :root {
      color-scheme: light;
      --bg: #edeff5;
      --panel: #eef1f7;
      --card: #f7f9fd;
      --text: #24344a;
      --muted: #6e7a91;
      --line: #dce3ef;
      --primary: #204a67;
      --primary-strong: #16374f;
      --accent: #8fb6a8;
      --shadow-dark: rgba(179, 191, 211, 0.65);
      --shadow-light: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg) 0%, #e8ebf2 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
    }

    .shell {
      min-height: 100vh;
      padding: 32px 16px;
    }

    .frame {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 28px;
      border-radius: 34px;
      background: var(--panel);
      box-shadow:
        18px 18px 38px var(--shadow-dark),
        -18px -18px 38px var(--shadow-light),
        inset 1px 1px 0 rgba(255, 255, 255, 0.45);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      text-decoration: none;
    }

    .logo {
      width: 62px;
      height: 62px;
      display: block;
      flex: 0 0 auto;
    }

    .divider {
      width: 2px;
      height: 46px;
      border-radius: 999px;
      background: var(--line);
      flex: 0 0 auto;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(32, 74, 103, 0.16);
      background: #f8fbff;
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow:
        8px 8px 16px rgba(186, 196, 212, 0.5),
        -8px -8px 16px rgba(255, 255, 255, 0.9);
    }

    .button.primary {
      border-color: rgba(22, 55, 79, 0.26);
      background: linear-gradient(120deg, var(--primary), var(--primary-strong));
      color: #ffffff;
      box-shadow: 0 14px 26px rgba(32, 74, 103, 0.25);
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
      padding: 20px 22px;
      border-radius: 22px;
      background: var(--card);
      box-shadow:
        12px 12px 24px rgba(183, 194, 211, 0.56),
        -12px -12px 24px rgba(255, 255, 255, 0.82);
    }

    .summary p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .pdf-card {
      overflow: hidden;
      border-radius: 26px;
      background: #ffffff;
      box-shadow:
        12px 12px 26px rgba(183, 194, 211, 0.6),
        -12px -12px 24px rgba(255, 255, 255, 0.82);
    }

    .pdf-view {
      display: block;
      width: 100%;
      height: min(78vh, 980px);
      min-height: 640px;
      border: 0;
      background: #ffffff;
    }

    .fallback {
      display: none;
      padding: 28px;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .shell {
        padding: 18px 12px;
      }

      .frame {
        padding: 18px;
        border-radius: 26px;
      }

      .top,
      .summary {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .top {
        display: grid;
      }

      .actions {
        justify-content: flex-start;
      }

      .logo {
        width: 54px;
        height: 54px;
      }

      .divider {
        height: 38px;
      }

      .pdf-view {
        height: 72vh;
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="frame" aria-labelledby="page-title">
      <div class="top">
        <a class="brand" href="/" aria-label="Back to OMW home">
          <img class="logo" src="../Icon.png" alt="OMW" />
          <span class="divider" aria-hidden="true"></span>
          <span>
            <p class="eyebrow">Private link</p>
            <h1 id="page-title">Daniel Blokbergen CV 2026</h1>
          </span>
        </a>

        <nav class="actions" aria-label="CV actions">
          <a class="button" href="/">OMW</a>
          <a class="button" href="daniel-blokbergen-cv-2026.pdf" target="_blank" rel="noreferrer">Open PDF</a>
          <a class="button primary" href="daniel-blokbergen-cv-2026.pdf" download>Download CV</a>
        </nav>
      </div>

      <div class="summary">
        <p>
          This page is intentionally unlisted and marked noindex. Anyone with the URL can view or download the PDF.
        </p>
      </div>

      <article class="pdf-card" aria-label="CV preview">
        <object class="pdf-view" data="daniel-blokbergen-cv-2026.pdf" type="application/pdf">
          <div class="fallback">
            Your browser cannot display this PDF inline.
            <a href="daniel-blokbergen-cv-2026.pdf" target="_blank" rel="noreferrer">Open the CV PDF instead.</a>
          </div>
        </object>
      </article>
    </section>
  </main>
</body>
</html>
